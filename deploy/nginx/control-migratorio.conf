upstream control_migratorio_frontend {
  server 127.0.0.1:4200;
}

upstream control_migratorio_backend {
  server 127.0.0.1:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name __FQDN__;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __FQDN__;

  ssl_certificate /etc/letsencrypt/live/__FQDN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  server_tokens off;

  client_max_body_size 25M;

  # Opcion 1 (recomendada): restringir por IP.
  # Descomenta para activar la lista de IPs permitidas.
  # include /etc/nginx/snippets/control-migratorio-allowlist.conf;

  # Opcion 2: exigir credenciales HTTP Basic a toda la app.
  # auth_basic "Acceso restringido - Control Migratorio";
  # auth_basic_user_file /etc/nginx/.htpasswd-control-migratorio;

  location /api/ {
    proxy_pass http://control_migratorio_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://control_migratorio_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
